name: tests
on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # Ключей у CI нет. Тесты работают с заглушкой вместо клиента; если вызов всё же уйдёт к модели,
      # он упадёт сразу на закрытом порту.
      OPENAI_API_KEY: ci-fake-key
      OLLAMA_BASE_URL: http://127.0.0.1:9/v1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pytest -q
